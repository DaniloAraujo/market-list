<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f3ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#222529" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Tá na Lista: listas simples para compras, casa, viagens e o que você precisar. Compartilhe e acompanhe em tempo real." />
    <link rel="manifest" href="/manifest.json" />
    <title>Tá na Lista</title>
    <script>
      try {
        var t = localStorage.getItem("theme") || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
